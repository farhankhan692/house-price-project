<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#0f172a; font-family:system-ui, -apple-system, sans-serif;">
  <text x="400" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">House Price Model Performance Comparison</text>
  <text x="400" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Evaluation of Error Norms (L1, L2 / RMSE) and Adjusted R²</text>

  <!-- Legend -->
  <rect x="180" y="85" width="16" height="12" fill="#38bdf8" rx="2"/>
  <text x="205" y="96" fill="#cbd5e1" font-size="12">RMSE ($k) [lower is better]</text>
  <rect x="420" y="85" width="16" height="12" fill="#34d399" rx="2"/>
  <text x="445" y="96" fill="#cbd5e1" font-size="12">Adj R² (%) [higher is better]</text>

  <!-- Chart Grid Area -->
  <line x1="80" y1="360" x2="740" y2="360" stroke="#334155" stroke-width="1.5"/>

  <!-- Group 1: Model 3 (Polynomial & Interaction) -->
  <text x="200" y="385" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Model 3</text>
  <text x="200" y="405" text-anchor="middle" fill="#94a3b8" font-size="11">(6 params)</text>

  <!-- RMSE Bar -->
  <rect x="130" y="263.5" width="56.0" height="96.5" fill="#38bdf8" rx="4"/>
  <text x="158.0" y="255.5" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">$3.65k</text>

  <!-- R2 Bar -->
  <rect x="200.0" y="185.4" width="56.0" height="174.6" fill="#34d399" rx="4"/>
  <text x="228.0" y="177.4" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">99.94%</text>

  <!-- Group 2: Model 2 (Multivariable Linear) -->
  <text x="410" y="385" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Model 2</text>
  <text x="410" y="405" text-anchor="middle" fill="#94a3b8" font-size="11">(6 params)</text>

  <!-- RMSE Bar -->
  <rect x="340" y="194.3" width="56.0" height="165.7" fill="#38bdf8" rx="4"/>
  <text x="368.0" y="186.3" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">$6.27k</text>

  <!-- R2 Bar -->
  <rect x="410.0" y="195.8" width="56.0" height="164.2" fill="#34d399" rx="4"/>
  <text x="438.0" y="187.8" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">99.82%</text>

  <!-- Group 3: Model 1 (Simple Linear) -->
  <text x="620" y="385" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Model 1</text>
  <text x="620" y="405" text-anchor="middle" fill="#94a3b8" font-size="11">(2 params)</text>

  <!-- RMSE Bar -->
  <rect x="550" y="180.0" width="56.0" height="180.0" fill="#38bdf8" rx="4"/>
  <text x="578.0" y="172.0" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">$6.82k</text>

  <!-- R2 Bar -->
  <rect x="620.0" y="197.1" width="56.0" height="162.9" fill="#34d399" rx="4"/>
  <text x="648.0" y="189.1" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">99.81%</text>
</svg>